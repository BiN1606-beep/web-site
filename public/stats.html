<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="robots" content="noindex">
    <title>Site stats | Osiris</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <!-- Your color theme and fonts, before the page is shown. -->
    <script src="/js/appearance-boot.js"></script>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/themes.css">
    <link rel="stylesheet" href="/css/charts.css">
    <link rel="stylesheet" href="/css/stats.css">
    <link rel="stylesheet" href="/css/motion.css">
  </head>
  <body class="stats-page">
    <!-- Filled in by js/stats.js from /api/stats (lua/osiris/stats.lua).
         Totals only, no personal data. Hover a number for what it means. -->
    <header class="stats-header">
      <a class="stats-back" href="/">&larr; Osiris</a>
      <h1>Stats</h1>
      <p class="stats-updated" id="stats-updated">Loading...</p>
    </header>

    <main class="stats-main" id="stats-main" hidden>
      <div class="chart-tiles" id="stats-tiles"></div>

      <section id="stats-members-section" aria-labelledby="stats-members-title" hidden>
        <div class="chart-head">
          <h2 id="stats-members-title">Members</h2>
          <input class="stats-search" id="stats-search" type="search" placeholder="Search name or email" aria-label="Search members">
        </div>
        <ul class="stats-members" id="stats-members"></ul>
      </section>

      <section aria-labelledby="stats-growth-title">
        <div class="chart-head">
          <h2 id="stats-growth-title">Members over time</h2>
          <div class="chart-switch" id="stats-growth-switch" role="group" aria-label="Which time span to show"></div>
        </div>
        <div class="chart-box" id="stats-growth"></div>
      </section>

      <section aria-labelledby="stats-trend-title">
        <div class="chart-head">
          <h2 id="stats-trend-title">Last 30 days</h2>
          <div class="chart-switch" id="stats-switch" role="group" aria-label="Which number to show"></div>
        </div>
        <div class="chart-box" id="stats-chart"></div>
      </section>

      <section aria-labelledby="stats-funnel-title">
        <h2 id="stats-funnel-title">Where people stop</h2>
        <ol class="chart-bars" id="stats-funnel"></ol>
      </section>

      <div class="chart-tiles is-small" id="stats-extra"></div>
    </main>

    <script src="/js/charts.js"></script>
    <script src="/js/stats.js"></script>
  </body>
</html>
