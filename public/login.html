<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Sign in | Osiris</title>
    <!-- Same fonts and colors as the rest of the site (public/css/base.css). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <style>
      :root {
        color-scheme: light;
        --base: #f5f2eb;
        --surface: #faf8f3;
        --border: #dcd5c6;
        --text: #24221d;
        --muted: #6b655a;
        --accent: #2f6b4f;
        --accent-hover: #24563f;
        --button-text: #fbfaf6;
        --error: #b03f38;
        --shadow: rgba(36, 34, 29, 0.09);
        font-family: "IBM Plex Sans", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
        color: var(--text);
        background: var(--base);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --base: #15140f;
          --surface: #1b1a15;
          --border: #36322a;
          --text: #ece6d9;
          --muted: #a8a091;
          --accent: #8cc29f;
          --accent-hover: #a5d2b5;
          --button-text: #15140f;
          --error: #e08a80;
          --shadow: rgba(0, 0, 0, 0.45);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 1.25rem;
        place-items: center;
      }

      main {
        width: min(100%, 28rem);
        padding: clamp(1.5rem, 6vw, 2.5rem);
        border: 1px solid var(--border);
        border-radius: 1rem;
        background: var(--surface);
        box-shadow: 0 1rem 2.5rem var(--shadow);
      }

      h1 {
        margin: 0;
        font-family: "Fraunces", Georgia, serif;
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      p {
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        color: var(--accent);
      }

      form {
        display: grid;
        gap: 0.8rem;
        margin-top: 1.25rem;
      }

      label {
        font-weight: 600;
      }

      input,
      button {
        min-height: 2.8rem;
        border: 1px solid var(--border);
        border-radius: 0.6rem;
        padding: 0.65rem 0.8rem;
        font: inherit;
      }

      input {
        width: 100%;
        color: inherit;
        background: var(--base);
      }

      input:focus-visible,
      button:focus-visible,
      .google-link:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      .remember-me {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        font-weight: 400;
      }

      .remember-me[hidden] {
        display: none;
      }

      .remember-me input {
        width: 1rem;
        min-height: 1rem;
        margin: 0;
        accent-color: var(--accent);
      }

      button,
      .google-link {
        border-color: transparent;
        color: var(--button-text);
        background: var(--accent);
        font-weight: 500;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
      }

      button:hover,
      .google-link:hover {
        background: var(--accent-hover);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .google-link {
        display: block;
        margin-top: 1.25rem;
        border-radius: 0.6rem;
        padding: 0.8rem;
      }

      .separator {
        margin: 1.2rem 0 0;
        text-align: center;
      }

      #switch-mode {
        display: block;
        width: 100%;
        margin-top: 1rem;
        border-color: var(--border);
        color: var(--accent);
        background: transparent;
      }

      #status {
        min-height: 1.5em;
        color: var(--error);
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="heading">Sign in</h1>
      <p>Sign in to continue to Osiris. <a href="/welcome">What is Osiris?</a></p>
      <a class="google-link" href="/api/auth/google">Continue with Google</a>
      <p class="separator">or use your email</p>
      <form id="auth-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="72" required>
        <p>Passwords must contain at least 12 characters and no more than 72 bytes.</p>
        <label class="remember-me" id="remember-me-label" for="remember-me">
          <input id="remember-me" name="rememberMe" type="checkbox">
          Remember me for 6 months
        </label>
        <button id="submit" type="submit">Sign in</button>
      </form>
      <button id="switch-mode" type="button">Create an account</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="/js/login.js"></script>
  </body>
</html>
