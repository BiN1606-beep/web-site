<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <!-- Osiris as a phone app: the manifest says how it looks when added to
         the home screen; the Apple lines do the same for iPhone. -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#f5f2eb" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#15140f" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Osiris">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <title>Sign in | Osiris</title>
    <!-- Same fonts and colors as the rest of the site (public/css/base.css). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
    <style>
      :root {
        color-scheme: light;
        --base: #f5f2eb;
        --surface: #faf8f3;
        --border: #dcd5c6;
        --text: #24221d;
        --muted: #6b655a;
        --accent: #2f6b4f;
        --accent-hover: #24563f;
        --button-text: #fbfaf6;
        --error: #b03f38;
        --shadow: rgba(36, 34, 29, 0.09);
        font-family: "IBM Plex Sans", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
        color: var(--text);
        background: var(--base);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --base: #15140f;
          --surface: #1b1a15;
          --border: #36322a;
          --text: #ece6d9;
          --muted: #a8a091;
          --accent: #8cc29f;
          --accent-hover: #a5d2b5;
          --button-text: #15140f;
          --error: #e08a80;
          --shadow: rgba(0, 0, 0, 0.45);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 1.25rem;
        place-items: center;
      }

      main {
        width: min(100%, 28rem);
        padding: clamp(1.5rem, 6vw, 2.5rem);
        border: 1px solid var(--border);
        border-radius: 1rem;
        background: var(--surface);
        box-shadow: 0 1rem 2.5rem var(--shadow);
      }

      h1 {
        margin: 0;
        font-family: "Fraunces", Georgia, serif;
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      p {
        color: var(--muted);
        line-height: 1.6;
      }

      a {
        color: var(--accent);
      }

      form {
        display: grid;
        gap: 0.8rem;
        margin-top: 1.25rem;
      }

      label {
        font-weight: 600;
      }

      input,
      button {
        min-height: 2.8rem;
        border: 1px solid var(--border);
        border-radius: 0.6rem;
        padding: 0.65rem 0.8rem;
        font: inherit;
      }

      input {
        width: 100%;
        color: inherit;
        background: var(--base);
      }

      input:focus-visible,
      button:focus-visible,
      .google-link:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      .remember-me {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        font-weight: 400;
      }

      .remember-me[hidden] {
        display: none;
      }

      .remember-me input {
        width: 1rem;
        min-height: 1rem;
        margin: 0;
        accent-color: var(--accent);
      }

      button,
      .google-link {
        border-color: transparent;
        color: var(--button-text);
        background: var(--accent);
        font-weight: 500;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
      }

      button:hover,
      .google-link:hover {
        background: var(--accent-hover);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .google-link {
        display: block;
        margin-top: 1.25rem;
        border-radius: 0.6rem;
        padding: 0.8rem;
      }

      .separator {
        margin: 1.2rem 0 0;
        text-align: center;
      }

      #switch-mode {
        display: block;
        width: 100%;
        margin-top: 1rem;
        border-color: var(--border);
        color: var(--accent);
        background: transparent;
      }

      /* A quiet promise under the form: how Osiris keeps your account safe. */
      .trust {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.35rem 1rem;
        margin: 1.4rem 0 0;
        padding: 0;
        list-style: none;
        color: var(--muted, inherit);
        font-size: 0.82rem;
        opacity: 0.8;
      }

      .trust li {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }

      .trust svg {
        width: 0.9rem;
        height: 0.9rem;
        fill: none;
        stroke: var(--accent);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* Password checklist on "Create account": a circle per rule that pops
         into a filled tick when the rule is met, or a cross when it is
         broken (too long). */
      .password-rules {
        display: flex;
        flex-wrap: wrap;
        gap: 0.45rem 1.1rem;
        margin: -0.2rem 0 0.1rem;
        padding: 0;
        list-style: none;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .password-rules[hidden],
      .password-rules li[hidden] {
        display: none;
      }

      .password-rules li {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        transition: color 0.2s ease;
      }

      .tick {
        display: grid;
        width: 1.15rem;
        height: 1.15rem;
        place-items: center;
        border: 2px solid var(--border);
        border-radius: 50%;
        transition: background 0.2s ease, border-color 0.2s ease;
      }

      .tick svg {
        width: 0.8rem;
        height: 0.8rem;
        fill: none;
        stroke: var(--button-text);
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .tick-check {
        stroke-dasharray: 20;
        stroke-dashoffset: 20;
        transition: stroke-dashoffset 0.25s ease 0.05s;
      }

      .tick-cross {
        display: none;
      }

      .password-rules li.met {
        color: var(--text);
      }

      .password-rules li.met .tick {
        border-color: var(--accent);
        background: var(--accent);
        animation: tick-pop 0.3s ease;
      }

      .password-rules li.met .tick-check {
        stroke-dashoffset: 0;
      }

      .password-rules li.broken {
        color: var(--error);
      }

      .password-rules li.broken .tick {
        border-color: var(--error);
        background: var(--error);
      }

      .password-rules li.broken .tick-check {
        display: none;
      }

      .password-rules li.broken .tick-cross {
        display: inline;
      }

      /* Pressing "Create account" before every rule is met gives the
         unmet rules a little shake. */
      .password-rules.nudge li:not(.met) {
        color: var(--error);
        animation: rule-shake 0.4s ease;
      }

      .password-rules.nudge li:not(.met) .tick {
        border-color: var(--error);
      }

      @keyframes tick-pop {
        50% { transform: scale(1.25); }
      }

      @keyframes rule-shake {
        20%, 60% { transform: translateX(-4px); }
        40%, 80% { transform: translateX(4px); }
      }

      @media (prefers-reduced-motion: reduce) {
        .password-rules *,
        .password-rules li {
          animation: none !important;
          transition: none !important;
        }
      }

      #status {
        min-height: 1.5em;
        color: var(--error);
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="heading">Sign in</h1>
      <p>Sign in to continue to Osiris. <a href="/welcome">What is Osiris?</a></p>
      <a class="google-link" href="/api/auth/google">Continue with Google</a>
      <p class="separator">or use your email</p>
      <form id="auth-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="72" required aria-describedby="password-rules">
        <!-- Only shown when creating an account: each rule ticks off live as
             you type (public/js/login.js). The server checks the same rules
             (valid_password in lua/osiris/accounts.lua). -->
        <ul class="password-rules" id="password-rules" aria-label="Password needs" aria-live="polite" hidden>
          <li data-rule="length"><span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="tick-check" d="m6 12.5 4 4 8-9"/><path class="tick-cross" d="m8 8 8 8M16 8l-8 8"/></svg></span><span class="rule-text">5–50 characters</span></li>
          <li data-rule="number"><span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="tick-check" d="m6 12.5 4 4 8-9"/><path class="tick-cross" d="m8 8 8 8M16 8l-8 8"/></svg></span><span class="rule-text">A number</span></li>
          <li data-rule="bytes" hidden><span class="tick" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="tick-check" d="m6 12.5 4 4 8-9"/><path class="tick-cross" d="m8 8 8 8M16 8l-8 8"/></svg></span><span class="rule-text">Fewer emoji or special letters</span></li>
        </ul>
        <label class="remember-me" id="remember-me-label" for="remember-me">
          <input id="remember-me" name="rememberMe" type="checkbox">
          Remember me for 6 months
        </label>
        <button id="submit" type="submit">Sign in</button>
      </form>
      <button id="switch-mode" type="button">Create an account</button>
      <p id="status" role="status" aria-live="polite"></p>
      <ul class="trust" aria-label="How Osiris keeps you safe">
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Encrypted</li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6z"/></svg>Passwords never stored</li>
        <li><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 8 8 8"/></svg>No ads, never sold</li>
      </ul>
    </main>
    <script src="/js/login.js"></script>
  </body>
</html>
