<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Osiris</title>
    <script>
      if (document.cookie.split(";").some((cookie) => cookie.trim() === "background-theme=dark")) {
        document.documentElement.classList.add("is-dark");
      }

      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("show-startup");
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        --base: #eff1f5;
        --surface: #e6e9ef;
        --panel: rgba(230, 233, 239, 0.94);
        --panel-border: #ccd0da;
        --text: #4c4f69;
        --muted: #6c6f85;
        --accent: #8839ef;
        --accent-hover: #7287fd;
        --accent-soft: rgba(136, 57, 239, 0.12);
        --button-text: #eff1f5;
        --shadow: rgba(76, 79, 105, 0.16);
        --backdrop: rgba(76, 79, 105, 0.35);
        --sun: #df8e1d;
        --moon: #1e66f5;
      }

      html.is-dark {
        color-scheme: dark;
        --base: #1e1e2e;
        --surface: #313244;
        --panel: rgba(49, 50, 68, 0.96);
        --panel-border: rgba(108, 112, 134, 0.55);
        --text: #cdd6f4;
        --muted: #a6adc8;
        --accent: #cba6f7;
        --accent-hover: #b4befe;
        --accent-soft: rgba(203, 166, 247, 0.16);
        --button-text: #1e1e2e;
        --shadow: rgba(17, 17, 27, 0.48);
        --backdrop: rgba(17, 17, 27, 0.72);
        --sun: #f9e2af;
        --moon: #89b4fa;
      }

      @font-face {
        font-family: "JetBrainsMono Nerd Font";
        src: url("/fonts/JetBrainsMonoNerdFont-Regular.ttf") format("truetype");
        font-style: normal;
        font-weight: 400;
        font-display: swap;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "JetBrainsMono Nerd Font", "JetBrains Mono", monospace;
        background: var(--base);
        color: var(--text);
        transition: background-color 200ms ease, color 200ms ease;
      }

      .startup-screen {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: none;
        place-items: center;
        overflow: hidden;
        background: var(--base);
        opacity: 1;
        transition: opacity 550ms ease;
      }

      .show-startup .startup-screen {
        display: grid;
      }

      .startup-screen.is-leaving {
        opacity: 0;
        pointer-events: none;
      }

      .show-startup .launcher-actions {
        opacity: 0;
      }

      .show-startup .launcher-actions.is-appearing {
        animation: launcher-fade-in 2s ease-out both;
      }

      .startup-logo-motion {
        display: flex;
        align-items: center;
        width: min(94vw, 780px);
        animation: logo-float 2.6s 1750ms ease-in-out infinite alternate;
      }

      .startup-logo-art {
        position: relative;
        flex: 0 0 min(44vw, 360px);
        width: min(44vw, 360px);
        aspect-ratio: 1;
      }

      .startup-wordmark {
        display: block;
        flex: 0 0 min(52vw, 430px);
        width: min(52vw, 430px);
        height: auto;
        margin-left: clamp(-28px, -3vw, -10px);
        opacity: 0;
        clip-path: inset(0 100% 0 0);
        animation: wordmark-extend 700ms cubic-bezier(0.2, 0.75, 0.25, 1) 1600ms both;
      }

      .startup-logo {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        background: url("/background-logo.png") center / contain no-repeat;
      }

      html.is-dark .startup-logo {
        background-image: url("/arvid-logo.png");
      }

      .startup-wordmark-dark {
        display: none;
      }

      html.is-dark .startup-wordmark-bright {
        display: none;
      }

      html.is-dark .startup-wordmark-dark {
        display: block;
      }

      .startup-logo-stripe {
        z-index: 1;
        opacity: 0;
        animation: logo-stripe-appear 220ms ease-out both;
        animation-delay: calc(250ms + var(--stripe-delay));
      }

      .startup-logo-stripe-1 {
        clip-path: polygon(65.12% 0, 100% 0, 100% 15%);
        --stripe-delay: 0ms;
      }

      .startup-logo-stripe-2 {
        clip-path: polygon(31.86% 0, 68.37% 0, 100% 13.6%, 100% 29.3%);
        --stripe-delay: 125ms;
      }

      .startup-logo-stripe-3 {
        clip-path: polygon(0 0, 35.12% 0, 100% 27.9%, 100% 43.6%, 0 0.6%);
        --stripe-delay: 250ms;
      }

      .startup-logo-stripe-4 {
        clip-path: polygon(0 0, 1.86% 0, 100% 42.2%, 100% 57.9%, 0 14.9%);
        --stripe-delay: 375ms;
      }

      .startup-logo-stripe-5 {
        clip-path: polygon(100% 56.5%, 100% 72.2%, 0 29.2%, 0 13.5%);
        --stripe-delay: 500ms;
      }

      .startup-logo-stripe-6 {
        clip-path: polygon(100% 70.8%, 100% 86.5%, 0 43.5%, 0 27.8%);
        --stripe-delay: 625ms;
      }

      .startup-logo-stripe-7 {
        clip-path: polygon(100% 85.1%, 100% 100%, 98.14% 100%, 0 57.8%, 0 42.1%);
        --stripe-delay: 750ms;
      }

      .startup-logo-stripe-8 {
        clip-path: polygon(100% 99.4%, 100% 100%, 64.88% 100%, 0 72.1%, 0 56.4%);
        --stripe-delay: 875ms;
      }

      .startup-logo-stripe-9 {
        clip-path: polygon(68.14% 100%, 31.63% 100%, 0 86.4%, 0 70.7%);
        --stripe-delay: 1000ms;
      }

      .startup-logo-stripe-10 {
        clip-path: polygon(34.88% 100%, 0 100%, 0 85%);
        --stripe-delay: 1125ms;
      }

      .startup-skip {
        position: absolute;
        right: 1.5rem;
        bottom: 1.5rem;
        padding: 0.65rem 0.9rem;
        border: 1px solid var(--panel-border);
        border-radius: 999px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        cursor: pointer;
        animation: skip-arrive 500ms 700ms both;
      }

      .startup-skip:hover {
        background: var(--accent-soft);
      }

      .startup-skip:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
      }

      main {
        width: min(90vw, 700px);
      }

      .main-logo-watermark {
        position: fixed;
        z-index: 0;
        inset: 0;
        --logo-glow-primary: rgba(255, 190, 65, 0.9);
        --logo-glow-secondary: rgba(255, 120, 45, 0.72);
        pointer-events: none;
      }

      .main-logo-watermark::before {
        position: absolute;
        inset: 0;
        z-index: 0;
        background:
          linear-gradient(90deg, transparent, var(--logo-glow-secondary), transparent) calc(50% - min(28vmin, 200px)) 50% / min(24vmin, 170px) 3px no-repeat,
          linear-gradient(90deg, transparent, var(--logo-glow-primary), transparent) calc(50% + min(28vmin, 200px)) 50% / min(24vmin, 170px) 3px no-repeat,
          radial-gradient(ellipse 24vmin 9vmin at calc(50% - min(19vmin, 135px)) 50%, var(--logo-glow-primary), transparent),
          radial-gradient(ellipse 24vmin 9vmin at calc(50% + min(19vmin, 135px)) 50%, var(--logo-glow-secondary), transparent);
        filter: blur(5px) saturate(1.8);
        opacity: 0.85;
        animation: logo-side-glow 4s linear infinite alternate;
        content: "";
      }

      .main-logo-watermark::after {
        position: absolute;
        z-index: 1;
        inset: 0;
        background: url("/background-logo.png") center / min(68vmin, 500px) no-repeat;
        content: "";
      }

      html.is-dark body .main-logo-watermark {
        opacity: 1;
        --logo-glow-primary: rgba(100, 180, 255, 0.95);
        --logo-glow-secondary: rgba(160, 100, 255, 0.84);
      }

      html.is-dark body .main-logo-watermark::after {
        background-image: url("/arvid-logo.png");
      }

      .launcher-actions {
        position: fixed;
        top: 1.5rem;
        right: 1.5rem;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        pointer-events: none;
      }

      .launcher-actions .launcher {
        pointer-events: auto;
      }

      .launcher {
        display: grid;
        width: 3.5rem;
        aspect-ratio: 1;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: var(--accent);
        color: var(--button-text);
        font: inherit;
        font-size: 1.75rem;
        line-height: 1;
        cursor: pointer;
        transition: background-color 200ms ease, color 200ms ease, transform 200ms ease;
      }

      .launcher svg {
        width: 1.5rem;
        height: 1.5rem;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .launcher:hover {
        transform: scale(1.08);
      }

      .launcher:focus-visible,
      .close-button:focus-visible,
      .background-toggle:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
      }

      .save-button:focus-visible,
      #shared-text:focus-visible,
      #groq-prompt:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }

      .content-panel {
        position: fixed;
        inset: 0;
        width: min(90vw, 700px);
        max-width: none;
        max-height: min(85vh, 700px);
        margin: auto;
        padding: 3rem 2.5rem;
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        background: var(--panel);
        color: var(--text);
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 45px var(--shadow);
      }

      .content-panel[open] {
        animation: expand-in 220ms ease-out both;
      }

      .content-panel[open].is-closing {
        animation: collapse-out 180ms ease-in both;
      }

      .content-panel::backdrop {
        background: var(--backdrop);
      }

      .close-button {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        display: grid;
        width: 2.5rem;
        aspect-ratio: 1;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 1.5rem;
        cursor: pointer;
      }

      .close-button:hover {
        background: var(--accent-soft);
        color: var(--text);
      }

      .background-toggle {
        display: flex;
        min-height: 2.75rem;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        padding: 0 0.9rem;
        border: 1px solid var(--panel-border);
        border-radius: 999px;
        background: var(--surface);
        color: var(--sun);
        font: inherit;
        font-size: 0.9rem;
        cursor: pointer;
      }

      .background-toggle svg {
        flex: 0 0 1.2rem;
        width: 1.2rem;
        height: 1.2rem;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .background-toggle .moon-icon {
        display: none;
        color: var(--moon);
      }

      html.is-dark body .background-toggle .sun-icon {
        display: none;
      }

      html.is-dark body .background-toggle .moon-icon {
        display: block;
      }

      .settings-section {
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--panel-border);
      }

      .settings-section h2 {
        margin: 0 0 1rem;
        color: var(--accent);
        font-size: 1.25rem;
      }

      .theme-setting {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .shared-text-form {
        display: grid;
        gap: 0.65rem;
        margin-top: 1.5rem;
      }

      .groq-form {
        display: grid;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }

      .groq-form label {
        color: var(--text);
        font-weight: 700;
      }

      #groq-prompt {
        width: 100%;
        min-height: 7rem;
        padding: 0.75rem;
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        resize: vertical;
      }

      #groq-answer {
        min-height: 1.8em;
        margin-top: 1.25rem;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .shared-text-form label {
        color: var(--text);
        font-weight: 700;
      }

      #shared-text {
        width: 100%;
        min-height: 8rem;
        padding: 0.75rem;
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        resize: vertical;
      }

      .save-button {
        justify-self: start;
        padding: 0.65rem 0.9rem;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--button-text);
        font: inherit;
        cursor: pointer;
      }

      .save-button:hover {
        background: var(--accent-hover);
      }

      .save-button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #save-status,
      #groq-status {
        min-height: 1.5em;
        font-size: 0.95rem;
      }

      .saved-text {
        min-height: 1.8em;
        margin-top: 0.75rem;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      @keyframes expand-in {
        from {
          opacity: 0;
          transform: scale(0.15);
        }

        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes collapse-out {
        from {
          opacity: 1;
          transform: scale(1);
        }

        to {
          opacity: 0;
          transform: scale(0.15);
        }
      }

      @keyframes logo-float {
        from {
          transform: translateY(0) scale(1);
        }

        to {
          transform: translateY(-9px) scale(1.015);
        }
      }

      @keyframes logo-side-glow {
        from {
          background-position:
            calc(50% - min(28vmin, 200px)) 50%,
            calc(50% + min(28vmin, 200px)) 50%,
            calc(50% - min(19vmin, 135px)) 50%,
            calc(50% + min(19vmin, 135px)) 50%;
        }

        to {
          background-position:
            calc(50% - min(34vmin, 240px)) 50%,
            calc(50% + min(34vmin, 240px)) 50%,
            calc(50% - min(23vmin, 165px)) 50%,
            calc(50% + min(23vmin, 165px)) 50%;
        }
      }

      @keyframes launcher-fade-in {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes logo-stripe-appear {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes wordmark-extend {
        from {
          opacity: 0;
          clip-path: inset(0 100% 0 0);
          transform: translateX(-16px);
        }

        to {
          opacity: 1;
          clip-path: inset(0);
          transform: translateX(0);
        }
      }

      @keyframes skip-arrive {
        from {
          opacity: 0;
          transform: translateY(5px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.5rem, 6vw, 4rem);
        line-height: 1.1;
        letter-spacing: -0.04em;
        color: var(--accent);
      }

      p {
        margin: 0;
        font-size: 1.1rem;
        line-height: 1.8;
        color: var(--muted);
        max-width: 38rem;
      }
    </style>
  </head>
  <body>
    <div class="startup-screen" id="startup-screen">
      <div class="startup-logo-motion">
        <div class="startup-logo-art" role="img" aria-label="Arvid logo">
          <div class="startup-logo startup-logo-stripe startup-logo-stripe-1"></div>
          <div class="startup-logo startup-logo-stripe startup-logo-stripe-2"></div>
          <div class="startup-logo startup-logo-stripe startup-logo-stripe-3"></div>
          <div class="startup-logo startup-logo-stripe startup-logo-stripe-4"></div>
          <div class="startup-logo startup-logo-stripe startup-logo-stripe-5"></div>
          <div class="startup-logo startup-logo-stripe startup-logo-stripe-6"></div>
          <div class="startup-logo startup-logo-stripe startup-logo-stripe-7"></div>
          <div class="startup-logo startup-logo-stripe startup-logo-stripe-8"></div>
          <div class="startup-logo startup-logo-stripe startup-logo-stripe-9"></div>
          <div class="startup-logo startup-logo-stripe startup-logo-stripe-10"></div>
        </div>
        <img class="startup-wordmark startup-wordmark-bright" src="/arvid-wordmark-bright.png" alt="" aria-hidden="true" width="550" height="182">
        <img class="startup-wordmark startup-wordmark-dark" src="/arvid-wordmark.png" alt="" aria-hidden="true" width="2220" height="752">
      </div>
      <button class="startup-skip" id="startup-skip" type="button" aria-label="Skip intro">&rarr;</button>
    </div>
    <main>
      <div class="main-logo-watermark" aria-hidden="true"></div>
      <nav class="launcher-actions" id="launcher-actions" aria-label="Quick access"></nav>
      <dialog class="content-panel" id="content-panel" aria-labelledby="panel-title">
        <button class="close-button" type="button" aria-label="Close panel">&times;</button>
        <h1 id="panel-title">Shared text</h1>
        <p>Everyone can see and edit this text. Changes are shared with all visitors.</p>
        <p class="saved-text" id="saved-text" aria-live="polite">Loading shared text...</p>
        <form class="shared-text-form" id="shared-text-form">
          <label for="shared-text">Edit the shared text</label>
          <textarea id="shared-text" name="text" maxlength="1000" aria-describedby="save-status"></textarea>
          <button class="save-button" id="save-button" type="submit">Save text</button>
          <p id="save-status" role="status"></p>
        </form>
      </dialog>
      <dialog class="content-panel" id="settings-panel" aria-labelledby="settings-title">
        <button class="close-button" type="button" aria-label="Close settings">&times;</button>
        <h1 id="settings-title">Settings</h1>
        <p>Adjust site preferences.</p>
        <section class="settings-section" aria-labelledby="account-title">
          <h2 id="account-title">Account</h2>
          <p id="account-email" aria-live="polite">Loading account...</p>
          <p id="account-status" role="status"></p>
          <button class="save-button" id="sign-out" type="button">Sign out</button>
        </section>
        <section class="settings-section" aria-labelledby="appearance-title">
          <h2 id="appearance-title">Appearance</h2>
          <div class="theme-setting">
            <button class="background-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false" title="Switch theme">
              <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
              </svg>
              <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
              <span id="background-toggle-label">Switch to dark theme</span>
            </button>
          </div>
        </section>
      </dialog>
      <dialog class="content-panel" id="groq-panel" aria-labelledby="groq-title">
        <button class="close-button" type="button" aria-label="Close Groq AI demo">&times;</button>
        <h1 id="groq-title">Groq AI demo</h1>
        <p>Send a prompt to GPT-OSS 120B through the Groq API.</p>
        <form class="groq-form" id="groq-form">
          <label for="groq-prompt">Your prompt</label>
          <textarea id="groq-prompt" name="message" maxlength="2000" required aria-describedby="groq-status"></textarea>
          <button class="save-button" id="groq-submit" type="submit">Ask Groq</button>
          <p id="groq-status" role="status" aria-live="polite"></p>
        </form>
        <p id="groq-answer" aria-live="polite"></p>
      </dialog>
    </main>
    <script>
      const startupScreen = document.querySelector("#startup-screen");
      const startupSkip = document.querySelector("#startup-skip");
      const launcherActions = document.querySelector("#launcher-actions");
      const launcherItems = [
        {
          dialogId: "content-panel",
          label: "Open shared text",
          icon: [
            { tag: "path", attributes: { d: "M12 5v14M5 12h14" } },
          ],
        },
        {
          dialogId: "settings-panel",
          label: "Open settings",
          icon: [
            { tag: "path", attributes: { d: "M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" } },
            { tag: "path", attributes: { d: "m19.4 15 .1.1a1.7 1.7 0 1 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 1 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 1 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 1 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 1 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V4a1.7 1.7 0 1 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 1 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 1 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2.9Z" } },
          ],
        },
        {
          dialogId: "groq-panel",
          label: "Open Groq AI test",
          icon: [
            { tag: "path", attributes: { d: "m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z" } },
            { tag: "path", attributes: { d: "m19 14 .9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9L19 14Z" } },
          ],
        },
      ];
      const launcherByDialog = new Map();
      const svgNamespace = "http://www.w3.org/2000/svg";

      for (const item of launcherItems) {
        const button = document.createElement("button");
        button.className = "launcher";
        button.type = "button";
        button.setAttribute("aria-label", item.label);
        button.setAttribute("aria-controls", item.dialogId);
        button.setAttribute("aria-expanded", "false");
        button.title = item.label.replace(/^Open /, "");

        const icon = document.createElementNS(svgNamespace, "svg");
        icon.setAttribute("viewBox", "0 0 24 24");
        icon.setAttribute("aria-hidden", "true");
        for (const shape of item.icon) {
          const element = document.createElementNS(svgNamespace, shape.tag);
          for (const [name, value] of Object.entries(shape.attributes)) {
            element.setAttribute(name, value);
          }
          icon.append(element);
        }

        button.append(icon);
        launcherActions.append(button);
        launcherByDialog.set(item.dialogId, button);
      }

      const launcher = launcherByDialog.get("content-panel");
      const panel = document.querySelector("#content-panel");
      const accountEmail = document.querySelector("#account-email");
      const accountStatus = document.querySelector("#account-status");
      const signOutButton = document.querySelector("#sign-out");
      const backgroundToggle = document.querySelector(".background-toggle");
      const backgroundToggleLabel = document.querySelector("#background-toggle-label");
      const sharedTextForm = document.querySelector("#shared-text-form");
      const sharedTextInput = document.querySelector("#shared-text");
      const savedText = document.querySelector("#saved-text");
      const saveButton = document.querySelector("#save-button");
      const saveStatus = document.querySelector("#save-status");
      const groqForm = document.querySelector("#groq-form");
      const groqPrompt = document.querySelector("#groq-prompt");
      const groqSubmit = document.querySelector("#groq-submit");
      const groqStatus = document.querySelector("#groq-status");
      const groqAnswer = document.querySelector("#groq-answer");

      const loadSharedText = async () => {
        try {
          const response = await fetch("/api/shared-text", { cache: "no-store" });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Could not load shared text.");
          sharedTextInput.value = result.text;
          savedText.textContent = result.text || "(The shared text is empty.)";
        } catch (error) {
          savedText.textContent = "Shared text could not be loaded.";
          saveStatus.textContent = error.message;
        }
      };

      sharedTextForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        saveButton.disabled = true;
        saveStatus.textContent = "Saving...";
        try {
          const response = await fetch("/api/shared-text", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: sharedTextInput.value }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Could not save shared text.");
          sharedTextInput.value = result.text;
          savedText.textContent = result.text || "(The shared text is empty.)";
          saveStatus.textContent = "Saved for everyone.";
        } catch (error) {
          saveStatus.textContent = error.message;
        } finally {
          saveButton.disabled = false;
        }
      });

      loadSharedText();

      const loadAccount = async () => {
        try {
          const response = await fetch("/api/auth/me", { cache: "no-store" });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Could not load account.");
          accountEmail.textContent = result.user.email;
        } catch (error) {
          accountEmail.textContent = "Account unavailable.";
          accountStatus.textContent = error.message;
        }
      };

      loadAccount();

      signOutButton.addEventListener("click", async () => {
        signOutButton.disabled = true;
        accountStatus.textContent = "Signing out...";
        try {
          const response = await fetch("/api/auth/logout", { method: "POST" });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Could not sign out.");
          window.location.replace("/login");
        } catch (error) {
          accountStatus.textContent = error.message;
          signOutButton.disabled = false;
        }
      });

      if (document.documentElement.classList.contains("show-startup")) {
        const page = document.querySelector("main");
        page.inert = true;

        const finishStartup = () => {
          if (startupScreen.classList.contains("is-leaving")) return;
          const restoreFocus = startupSkip.matches(":focus");
          startupScreen.classList.add("is-leaving");
          window.setTimeout(() => {
            startupScreen.remove();
            page.inert = false;
            launcherActions.classList.add("is-appearing");
            if (restoreFocus) launcher.focus();
          }, 600);
        };

        startupSkip.addEventListener("click", finishStartup);
        window.setTimeout(finishStartup, 2500);
      }

      let activePanel = null;
      let queuedPanel = null;

      const closePanel = (dialog) => {
        if (dialog.classList.contains("is-closing")) return;
        dialog.classList.add("is-closing");
        dialog.querySelector(".close-button").disabled = true;
      };

      const openPanel = (dialog, trigger) => {
        if (activePanel === dialog && dialog.open) return;
        if (activePanel?.open) {
          queuedPanel = { dialog, trigger };
          closePanel(activePanel);
          return;
        }

        dialog.showModal();
        activePanel = dialog;
        if (trigger.getAttribute("aria-controls") === dialog.id) {
          trigger.setAttribute("aria-expanded", "true");
        }
      };

      const dialogs = launcherItems.map(({ dialogId }) => [
        document.getElementById(dialogId),
        launcherByDialog.get(dialogId),
      ]);

      for (const [dialog, dialogTrigger] of dialogs) {
        const dialogCloseButton = dialog.querySelector(".close-button");

        dialogCloseButton.addEventListener("click", () => closePanel(dialog));
        dialog.addEventListener("cancel", (event) => {
          event.preventDefault();
          closePanel(dialog);
        });
        dialog.addEventListener("animationend", (event) => {
          if (event.animationName === "collapse-out" || event.animationName === "menu-slide-out") {
            dialog.close();
          }
        });
        dialog.addEventListener("close", () => {
          dialog.classList.remove("is-closing");
          dialogCloseButton.disabled = false;
          if (dialogTrigger.getAttribute("aria-controls") === dialog.id) {
            dialogTrigger.setAttribute("aria-expanded", "false");
          }
          if (activePanel === dialog) activePanel = null;

          if (queuedPanel) {
            const nextPanel = queuedPanel;
            queuedPanel = null;
            openPanel(nextPanel.dialog, nextPanel.trigger);
            return;
          }

          dialogTrigger.focus();
        });
      }

      for (const [dialog, trigger] of dialogs) {
        trigger.addEventListener("click", () => openPanel(dialog, trigger));
      }

      groqForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (new TextEncoder().encode(groqPrompt.value).length > 2000) {
          groqStatus.textContent = "Prompt must be 2000 bytes or fewer.";
          return;
        }
        groqSubmit.disabled = true;
        groqStatus.textContent = "Thinking...";
        groqAnswer.textContent = "";
        try {
          const response = await fetch("/api/groq-chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: groqPrompt.value }),
          });
          let result;
          if (response.headers.get("Content-Type")?.includes("application/json")) {
            result = await response.json();
          } else if (!response.ok) {
            throw new Error(response.status === 429
              ? "Too many requests. Try again shortly."
              : "Groq request failed.");
          } else {
            throw new Error("Groq returned an unexpected response.");
          }
          if (!response.ok) {
            const message = typeof result.error === "string" ? result.error : result.error?.message;
            throw new Error(message || "Groq request failed.");
          }
          const answer = result.choices?.[0]?.message?.content;
          if (typeof answer !== "string") throw new Error("Groq returned an unexpected response.");
          groqAnswer.textContent = answer;
          groqStatus.textContent = "Response received.";
        } catch (error) {
          groqStatus.textContent = error.message;
        } finally {
          groqSubmit.disabled = false;
        }
      });

      backgroundToggle.addEventListener("click", () => {
        const isDark = document.documentElement.classList.toggle("is-dark");
        const secureAttribute = location.protocol === "https:" ? "; Secure" : "";
        document.cookie = `background-theme=${isDark ? "dark" : "light"}; Path=/; Max-Age=31536000; SameSite=Lax${secureAttribute}`;
        backgroundToggle.setAttribute("aria-pressed", String(isDark));
        backgroundToggleLabel.textContent = isDark ? "Switch to light theme" : "Switch to dark theme";
        backgroundToggle.setAttribute("aria-label", backgroundToggleLabel.textContent);
      });

      const isDark = document.documentElement.classList.contains("is-dark");
      backgroundToggle.setAttribute("aria-pressed", String(isDark));
      backgroundToggleLabel.textContent = isDark ? "Switch to light theme" : "Switch to dark theme";
      backgroundToggle.setAttribute("aria-label", backgroundToggleLabel.textContent);
    </script>
  </body>
</html>
