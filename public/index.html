<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shared text</title>
    <script>
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("show-startup");
      }
    </script>
    <style>
      :root {
        --panel: rgba(255, 255, 255, 0.8);
        --panel-border: rgba(148, 163, 184, 0.2);
        --text: #0f172a;
        --muted: #475569;
        --accent: #2563eb;
        --accent-soft: rgba(37, 99, 235, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: #fff;
        color: var(--text);
        transition: background-color 200ms ease;
      }

      body.is-dark {
        background: #000;
      }

      .startup-screen {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: none;
        place-items: center;
        overflow: hidden;
        background: #000;
        opacity: 1;
        transition: opacity 550ms ease;
      }

      .show-startup .startup-screen {
        display: grid;
      }

      .startup-screen.is-leaving {
        opacity: 0;
        pointer-events: none;
      }

      .show-startup .launcher-actions {
        opacity: 0;
      }

      .show-startup .launcher-actions.is-appearing {
        animation: launcher-fade-in 2s ease-out both;
      }

      .startup-logo-motion {
        display: flex;
        align-items: center;
        width: min(94vw, 780px);
        animation: logo-float 2.6s 1750ms ease-in-out infinite alternate;
      }

      .startup-logo-art {
        position: relative;
        flex: 0 0 min(44vw, 360px);
        width: min(44vw, 360px);
        aspect-ratio: 1;
      }

      .startup-wordmark {
        display: block;
        flex: 0 0 min(52vw, 430px);
        width: min(52vw, 430px);
        height: auto;
        margin-left: clamp(-28px, -3vw, -10px);
        opacity: 0;
        clip-path: inset(0 100% 0 0);
        animation: wordmark-extend 700ms cubic-bezier(0.2, 0.75, 0.25, 1) 1600ms both;
      }

      .startup-logo {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      .startup-logo-stripe {
        opacity: 0;
        animation: logo-stripe-appear 220ms ease-out both;
        animation-delay: calc(250ms + var(--stripe-delay));
      }

      .startup-logo-stripe-1 {
        clip-path: polygon(65.12% 0, 100% 0, 100% 15%);
        --stripe-delay: 0ms;
      }

      .startup-logo-stripe-2 {
        clip-path: polygon(31.86% 0, 68.37% 0, 100% 13.6%, 100% 29.3%);
        --stripe-delay: 125ms;
      }

      .startup-logo-stripe-3 {
        clip-path: polygon(0 0, 35.12% 0, 100% 27.9%, 100% 43.6%, 0 0.6%);
        --stripe-delay: 250ms;
      }

      .startup-logo-stripe-4 {
        clip-path: polygon(0 0, 1.86% 0, 100% 42.2%, 100% 57.9%, 0 14.9%);
        --stripe-delay: 375ms;
      }

      .startup-logo-stripe-5 {
        clip-path: polygon(100% 56.5%, 100% 72.2%, 0 29.2%, 0 13.5%);
        --stripe-delay: 500ms;
      }

      .startup-logo-stripe-6 {
        clip-path: polygon(100% 70.8%, 100% 86.5%, 0 43.5%, 0 27.8%);
        --stripe-delay: 625ms;
      }

      .startup-logo-stripe-7 {
        clip-path: polygon(100% 85.1%, 100% 100%, 98.14% 100%, 0 57.8%, 0 42.1%);
        --stripe-delay: 750ms;
      }

      .startup-logo-stripe-8 {
        clip-path: polygon(100% 99.4%, 100% 100%, 64.88% 100%, 0 72.1%, 0 56.4%);
        --stripe-delay: 875ms;
      }

      .startup-logo-stripe-9 {
        clip-path: polygon(68.14% 100%, 31.63% 100%, 0 86.4%, 0 70.7%);
        --stripe-delay: 1000ms;
      }

      .startup-logo-stripe-10 {
        clip-path: polygon(34.88% 100%, 0 100%, 0 85%);
        --stripe-delay: 1125ms;
      }

      .startup-skip {
        position: absolute;
        right: 1.5rem;
        bottom: 1.5rem;
        padding: 0.65rem 0.9rem;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font: inherit;
        cursor: pointer;
        animation: skip-arrive 500ms 700ms both;
      }

      .startup-skip:hover {
        background: rgba(255, 255, 255, 0.16);
      }

      .startup-skip:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 4px;
      }

      main {
        width: min(90vw, 700px);
      }

      .launcher-actions {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }

      .launcher-actions .launcher {
        position: absolute;
        pointer-events: auto;
      }

      #launcher {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      #launcher:hover {
        transform: translate(-50%, -50%) scale(1.08);
      }

      #menu-launcher {
        top: 1.5rem;
        left: 1.5rem;
      }

      .launcher {
        display: grid;
        width: 3.5rem;
        aspect-ratio: 1;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: #000;
        color: #fff;
        font: inherit;
        font-size: 1.75rem;
        line-height: 1;
        cursor: pointer;
        transition: background-color 200ms ease, color 200ms ease, transform 200ms ease;
      }

      body.is-dark .launcher {
        background: #fff;
        color: #000;
      }

      .launcher:hover {
        transform: scale(1.08);
      }

      .launcher:focus-visible,
      .close-button:focus-visible,
      .background-toggle:focus-visible,
      .menu-action:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
      }

      .save-button:focus-visible,
      #shared-text:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }

      .content-panel {
        position: fixed;
        inset: 0;
        width: min(90vw, 700px);
        max-width: none;
        max-height: min(85vh, 700px);
        margin: auto;
        padding: 3rem 2.5rem;
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        background: #fff;
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
      }

      .content-panel[open] {
        animation: expand-in 220ms ease-out both;
      }

      .content-panel[open].is-closing {
        animation: collapse-out 180ms ease-in both;
      }

      .content-panel::backdrop {
        background: rgba(15, 23, 42, 0.12);
      }

      .menu-panel {
        width: min(90vw, 420px);
      }

      .close-button {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        display: grid;
        width: 2.5rem;
        aspect-ratio: 1;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 1.5rem;
        cursor: pointer;
      }

      .close-button:hover {
        background: var(--accent-soft);
        color: var(--text);
      }

      .background-toggle {
        margin-top: 1.5rem;
        display: grid;
        width: 2.75rem;
        aspect-ratio: 1;
        place-items: center;
        padding: 0;
        border: 1px solid var(--panel-border);
        border-radius: 50%;
        background: #fff;
        color: #b45309;
        font: inherit;
        cursor: pointer;
      }

      .background-toggle svg {
        width: 1.35rem;
        height: 1.35rem;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .background-toggle .moon-icon {
        display: none;
        color: #1d4ed8;
      }

      body.is-dark .background-toggle .sun-icon {
        display: none;
      }

      body.is-dark .background-toggle .moon-icon {
        display: block;
      }

      .shared-text-form {
        display: grid;
        gap: 0.65rem;
        margin-top: 1.5rem;
      }

      .shared-text-form label {
        color: var(--text);
        font-weight: 700;
      }

      #shared-text {
        width: 100%;
        min-height: 8rem;
        padding: 0.75rem;
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        color: var(--text);
        font: inherit;
        resize: vertical;
      }

      .save-button,
      .menu-action {
        justify-self: start;
        padding: 0.65rem 0.9rem;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }

      .save-button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #save-status {
        min-height: 1.5em;
        font-size: 0.95rem;
      }

      .saved-text {
        min-height: 1.8em;
        margin-top: 0.75rem;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      @keyframes expand-in {
        from {
          opacity: 0;
          transform: scale(0.15);
        }

        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes collapse-out {
        from {
          opacity: 1;
          transform: scale(1);
        }

        to {
          opacity: 0;
          transform: scale(0.15);
        }
      }

      @keyframes logo-float {
        from {
          transform: translateY(0) scale(1);
        }

        to {
          transform: translateY(-9px) scale(1.015);
        }
      }

      @keyframes launcher-fade-in {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes logo-stripe-appear {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes wordmark-extend {
        from {
          opacity: 0;
          clip-path: inset(0 100% 0 0);
          transform: translateX(-16px);
        }

        to {
          opacity: 1;
          clip-path: inset(0);
          transform: translateX(0);
        }
      }

      @keyframes skip-arrive {
        from {
          opacity: 0;
          transform: translateY(5px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.5rem, 6vw, 4rem);
        line-height: 1.1;
        letter-spacing: -0.04em;
        color: var(--accent);
      }

      p {
        margin: 0;
        font-size: 1.1rem;
        line-height: 1.8;
        color: var(--muted);
        max-width: 38rem;
      }
    </style>
  </head>
  <body>
    <div class="startup-screen" id="startup-screen">
      <div class="startup-logo-motion">
        <div class="startup-logo-art">
          <img class="startup-logo startup-logo-stripe startup-logo-stripe-1" src="/arvid-logo.png" alt="Arvid logo" width="500" height="500">
          <img class="startup-logo startup-logo-stripe startup-logo-stripe-2" src="/arvid-logo.png" alt="" aria-hidden="true">
          <img class="startup-logo startup-logo-stripe startup-logo-stripe-3" src="/arvid-logo.png" alt="" aria-hidden="true">
          <img class="startup-logo startup-logo-stripe startup-logo-stripe-4" src="/arvid-logo.png" alt="" aria-hidden="true">
          <img class="startup-logo startup-logo-stripe startup-logo-stripe-5" src="/arvid-logo.png" alt="" aria-hidden="true">
          <img class="startup-logo startup-logo-stripe startup-logo-stripe-6" src="/arvid-logo.png" alt="" aria-hidden="true">
          <img class="startup-logo startup-logo-stripe startup-logo-stripe-7" src="/arvid-logo.png" alt="" aria-hidden="true">
          <img class="startup-logo startup-logo-stripe startup-logo-stripe-8" src="/arvid-logo.png" alt="" aria-hidden="true">
          <img class="startup-logo startup-logo-stripe startup-logo-stripe-9" src="/arvid-logo.png" alt="" aria-hidden="true">
          <img class="startup-logo startup-logo-stripe startup-logo-stripe-10" src="/arvid-logo.png" alt="" aria-hidden="true">
        </div>
        <img class="startup-wordmark" src="/arvid-wordmark.png" alt="" aria-hidden="true" width="2220" height="752">
      </div>
      <button class="startup-skip" id="startup-skip" type="button" aria-label="Skip intro">&rarr;</button>
    </div>
    <main>
      <div class="launcher-actions" id="launcher-actions">
        <button class="launcher" id="launcher" type="button" aria-label="Open shared text panel" aria-controls="content-panel" aria-expanded="false">
          +
        </button>
        <button class="launcher" id="menu-launcher" type="button" aria-label="Open menu" aria-controls="menu-panel" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>
      <dialog class="content-panel" id="content-panel" aria-labelledby="panel-title">
        <button class="close-button" type="button" aria-label="Close panel">&times;</button>
        <h1 id="panel-title">Shared text</h1>
        <p>Everyone can see and edit this text. Changes are shared with all visitors.</p>
        <p class="saved-text" id="saved-text" aria-live="polite">Loading shared text...</p>
        <form class="shared-text-form" id="shared-text-form">
          <label for="shared-text">Edit the shared text</label>
          <textarea id="shared-text" name="text" maxlength="1000" aria-describedby="save-status"></textarea>
          <button class="save-button" id="save-button" type="submit">Save text</button>
          <p id="save-status" role="status"></p>
        </form>
        <button class="background-toggle" type="button" aria-label="Switch to black background" aria-pressed="false" title="Switch background">
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <button class="menu-action" id="open-menu" type="button">Menu</button>
      </dialog>
      <dialog class="content-panel menu-panel" id="menu-panel" aria-labelledby="menu-title">
        <button class="close-button" type="button" aria-label="Close menu">&times;</button>
        <h1 id="menu-title">Menu</h1>
        <p>Choose a place to go.</p>
        <button class="menu-action" id="open-shared-text" type="button">Shared text</button>
      </dialog>
    </main>
    <script>
      const startupScreen = document.querySelector("#startup-screen");
      const startupSkip = document.querySelector("#startup-skip");
      const launcher = document.querySelector("#launcher");
      const menuLauncher = document.querySelector("#menu-launcher");
      const launcherActions = document.querySelector("#launcher-actions");
      const panel = document.querySelector("#content-panel");
      const menuPanel = document.querySelector("#menu-panel");
      const openMenuButton = document.querySelector("#open-menu");
      const openSharedTextButton = document.querySelector("#open-shared-text");
      const backgroundToggle = document.querySelector(".background-toggle");
      const sharedTextForm = document.querySelector("#shared-text-form");
      const sharedTextInput = document.querySelector("#shared-text");
      const savedText = document.querySelector("#saved-text");
      const saveButton = document.querySelector("#save-button");
      const saveStatus = document.querySelector("#save-status");

      const loadSharedText = async () => {
        try {
          const response = await fetch("/api/shared-text", { cache: "no-store" });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Could not load shared text.");
          sharedTextInput.value = result.text;
          savedText.textContent = result.text || "(The shared text is empty.)";
        } catch (error) {
          savedText.textContent = "Shared text could not be loaded.";
          saveStatus.textContent = error.message;
        }
      };

      sharedTextForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        saveButton.disabled = true;
        saveStatus.textContent = "Saving...";
        try {
          const response = await fetch("/api/shared-text", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: sharedTextInput.value }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Could not save shared text.");
          sharedTextInput.value = result.text;
          savedText.textContent = result.text || "(The shared text is empty.)";
          saveStatus.textContent = "Saved for everyone.";
        } catch (error) {
          saveStatus.textContent = error.message;
        } finally {
          saveButton.disabled = false;
        }
      });

      loadSharedText();

      if (document.documentElement.classList.contains("show-startup")) {
        const page = document.querySelector("main");
        page.inert = true;

        const finishStartup = () => {
          if (startupScreen.classList.contains("is-leaving")) return;
          const restoreFocus = startupSkip.matches(":focus");
          startupScreen.classList.add("is-leaving");
          window.setTimeout(() => {
            startupScreen.remove();
            page.inert = false;
            launcherActions.classList.add("is-appearing");
            if (restoreFocus) launcher.focus();
          }, 600);
        };

        startupSkip.addEventListener("click", finishStartup);
        window.setTimeout(finishStartup, 2500);
      }

      let activePanel = null;
      let queuedPanel = null;

      const closePanel = (dialog) => {
        if (dialog.classList.contains("is-closing")) return;
        dialog.classList.add("is-closing");
        dialog.querySelector(".close-button").disabled = true;
      };

      const openPanel = (dialog, trigger) => {
        if (activePanel === dialog && dialog.open) return;
        if (activePanel?.open) {
          queuedPanel = { dialog, trigger };
          closePanel(activePanel);
          return;
        }

        dialog.showModal();
        activePanel = dialog;
        trigger.setAttribute("aria-expanded", "true");
      };

      for (const dialog of [panel, menuPanel]) {
        const dialogTrigger = dialog === panel ? launcher : menuLauncher;
        const dialogCloseButton = dialog.querySelector(".close-button");

        dialogCloseButton.addEventListener("click", () => closePanel(dialog));
        dialog.addEventListener("cancel", (event) => {
          event.preventDefault();
          closePanel(dialog);
        });
        dialog.addEventListener("animationend", (event) => {
          if (event.animationName === "collapse-out") dialog.close();
        });
        dialog.addEventListener("close", () => {
          dialog.classList.remove("is-closing");
          dialogCloseButton.disabled = false;
          dialogTrigger.setAttribute("aria-expanded", "false");
          if (activePanel === dialog) activePanel = null;

          if (queuedPanel) {
            const nextPanel = queuedPanel;
            queuedPanel = null;
            openPanel(nextPanel.dialog, nextPanel.trigger);
            return;
          }

          dialogTrigger.focus();
        });
      }

      launcher.addEventListener("click", () => openPanel(panel, launcher));
      menuLauncher.addEventListener("click", () => openPanel(menuPanel, menuLauncher));
      openMenuButton.addEventListener("click", () => openPanel(menuPanel, menuLauncher));
      openSharedTextButton.addEventListener("click", () => openPanel(panel, launcher));

      backgroundToggle.addEventListener("click", () => {
        const isDark = document.body.classList.toggle("is-dark");
        backgroundToggle.setAttribute("aria-pressed", String(isDark));
        backgroundToggle.setAttribute("aria-label", isDark ? "Switch to white background" : "Switch to black background");
      });
    </script>
  </body>
</html>
