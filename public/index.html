<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenResty Starter</title>
    <style>
      :root {
        --bg-start: #eef4ff;
        --bg-end: #dfeafe;
        --panel: rgba(255, 255, 255, 0.8);
        --panel-border: rgba(148, 163, 184, 0.2);
        --text: #0f172a;
        --muted: #475569;
        --accent: #2563eb;
        --accent-soft: rgba(37, 99, 235, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
        color: var(--text);
      }

      main {
        width: min(90vw, 700px);
        padding: 3rem 2.5rem;
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        background: var(--panel);
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.5rem, 6vw, 4rem);
        line-height: 1.1;
        letter-spacing: -0.04em;
        color: var(--accent);
      }

      p {
        margin: 0;
        font-size: 1.1rem;
        line-height: 1.8;
        color: var(--muted);
        max-width: 38rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Arvid</h1>
      <p>
        This is THE website.
        hejhej jag heter barvi......
      </p>
    </main>
  </body>
</html>
