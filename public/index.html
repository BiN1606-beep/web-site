<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenResty Starter</title>
    <style>
      :root {
        --panel: rgba(255, 255, 255, 0.8);
        --panel-border: rgba(148, 163, 184, 0.2);
        --text: #0f172a;
        --muted: #475569;
        --accent: #2563eb;
        --accent-soft: rgba(37, 99, 235, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: #fff;
        color: var(--text);
        transition: background-color 200ms ease;
      }

      body.is-dark {
        background: #000;
      }

      main {
        width: min(90vw, 700px);
      }

      .launcher {
        position: fixed;
        top: 50%;
        left: 50%;
        display: grid;
        width: 3.5rem;
        aspect-ratio: 1;
        place-items: center;
        transform: translate(-50%, -50%);
        border: 0;
        border-radius: 50%;
        background: #000;
        color: #fff;
        font: inherit;
        font-size: 1.75rem;
        line-height: 1;
        cursor: pointer;
        transition: background-color 200ms ease, color 200ms ease, transform 200ms ease;
      }

      body.is-dark .launcher {
        background: #fff;
        color: #000;
      }

      .launcher:hover {
        transform: translate(-50%, -50%) scale(1.08);
      }

      .launcher:focus-visible,
      .close-button:focus-visible,
      .background-toggle:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
      }

      .content-panel {
        position: fixed;
        inset: 0;
        width: min(90vw, 700px);
        max-width: none;
        max-height: min(85vh, 700px);
        margin: auto;
        padding: 3rem 2.5rem;
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        background: #fff;
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
      }

      .content-panel[open] {
        animation: expand-in 220ms ease-out both;
      }

      .content-panel[open].is-closing {
        animation: collapse-out 180ms ease-in both;
      }

      .content-panel::backdrop {
        background: rgba(15, 23, 42, 0.12);
      }

      .close-button {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        display: grid;
        width: 2.5rem;
        aspect-ratio: 1;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 1.5rem;
        cursor: pointer;
      }

      .close-button:hover {
        background: var(--accent-soft);
        color: var(--text);
      }

      .background-toggle {
        margin-top: 1.5rem;
        padding: 0.65rem 0.9rem;
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      @keyframes expand-in {
        from {
          opacity: 0;
          transform: scale(0.15);
        }

        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes collapse-out {
        from {
          opacity: 1;
          transform: scale(1);
        }

        to {
          opacity: 0;
          transform: scale(0.15);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.5rem, 6vw, 4rem);
        line-height: 1.1;
        letter-spacing: -0.04em;
        color: var(--accent);
      }

      p {
        margin: 0;
        font-size: 1.1rem;
        line-height: 1.8;
        color: var(--muted);
        max-width: 38rem;
      }
    </style>
  </head>
  <body>
    <main>
      <button class="launcher" id="launcher" type="button" aria-label="Open Arvid panel" aria-controls="content-panel" aria-expanded="false">
        +
      </button>
      <dialog class="content-panel" id="content-panel" aria-labelledby="panel-title">
        <button class="close-button" type="button" aria-label="Close panel">&times;</button>
        <h1 id="panel-title">Arvid</h1>
        <p>
          This is THE website.
          hejhej jag heter barvi......
        </p>
        <button class="background-toggle" type="button" aria-pressed="false">Use dark background</button>
      </dialog>
    </main>
    <script>
      const launcher = document.querySelector("#launcher");
      const panel = document.querySelector("#content-panel");
      const closeButton = document.querySelector(".close-button");
      const backgroundToggle = document.querySelector(".background-toggle");

      launcher.addEventListener("click", () => {
        panel.showModal();
        launcher.setAttribute("aria-expanded", "true");
      });
      const closePanel = () => {
        if (panel.classList.contains("is-closing")) return;
        panel.classList.add("is-closing");
        closeButton.disabled = true;
      };

      closeButton.addEventListener("click", closePanel);
      panel.addEventListener("cancel", (event) => {
        event.preventDefault();
        closePanel();
      });
      panel.addEventListener("animationend", (event) => {
        if (event.animationName === "collapse-out") panel.close();
      });
      panel.addEventListener("close", () => {
        panel.classList.remove("is-closing");
        closeButton.disabled = false;
        launcher.setAttribute("aria-expanded", "false");
        launcher.focus();
      });

      backgroundToggle.addEventListener("click", () => {
        const isDark = document.body.classList.toggle("is-dark");
        backgroundToggle.setAttribute("aria-pressed", String(isDark));
        backgroundToggle.textContent = isDark ? "Use light background" : "Use dark background";
      });
    </script>
  </body>
</html>
