<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shared text</title>
    <script>
      if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.classList.add("show-startup");
      }
    </script>
    <style>
      :root {
        --panel: rgba(255, 255, 255, 0.8);
        --panel-border: rgba(148, 163, 184, 0.2);
        --text: #0f172a;
        --muted: #475569;
        --accent: #2563eb;
        --accent-soft: rgba(37, 99, 235, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: #fff;
        color: var(--text);
        transition: background-color 200ms ease;
      }

      body.is-dark {
        background: #000;
      }

      .startup-screen {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: none;
        place-items: center;
        overflow: hidden;
        background: #000;
        opacity: 1;
        transition: opacity 550ms ease;
      }

      .show-startup .startup-screen {
        display: grid;
      }

      .startup-screen.is-leaving {
        opacity: 0;
        pointer-events: none;
      }

      .startup-logo-motion {
        width: min(72vw, 360px);
        animation: logo-float 2.6s 900ms ease-in-out infinite alternate;
      }

      .startup-logo-art {
        position: relative;
        width: 100%;
        aspect-ratio: 1;
        animation: logo-arrive 900ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }

      .startup-logo {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      .startup-logo-upper {
        clip-path: polygon(0 0, 100% 0, 100% 69.4%, 17% 40%);
      }

      .startup-logo-stripe {
        opacity: 0;
        animation: logo-stripe-appear 180ms ease-out both;
        animation-delay: calc(900ms + var(--stripe-delay));
      }

      .startup-logo-stripe-1 {
        clip-path: polygon(17% 40%, 81% 69.4%, 81% 72.6%, 17% 43.2%);
        --stripe-delay: 0ms;
      }

      .startup-logo-stripe-2 {
        clip-path: polygon(17% 45.5%, 81% 74.9%, 81% 78.1%, 17% 48.7%);
        --stripe-delay: 170ms;
      }

      .startup-logo-stripe-3 {
        clip-path: polygon(17% 51%, 81% 80.4%, 81% 83.6%, 17% 54.2%);
        --stripe-delay: 340ms;
      }

      .startup-logo-stripe-4 {
        clip-path: polygon(17% 56.5%, 81% 85.9%, 81% 89.1%, 17% 59.7%);
        --stripe-delay: 510ms;
      }

      .startup-logo-stripe-5 {
        clip-path: polygon(17% 62%, 81% 91.4%, 81% 94.6%, 17% 65.2%);
        --stripe-delay: 680ms;
      }

      .startup-logo-stripe-6 {
        clip-path: polygon(17% 67.5%, 81% 96.9%, 81% 100.1%, 17% 70.7%);
        --stripe-delay: 850ms;
      }

      .startup-logo-complete {
        opacity: 0;
        animation: logo-complete 250ms 1980ms ease-out both;
      }

      .startup-skip {
        position: absolute;
        right: 1.5rem;
        bottom: 1.5rem;
        padding: 0.65rem 0.9rem;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font: inherit;
        cursor: pointer;
        animation: skip-arrive 500ms 700ms both;
      }

      .startup-skip:hover {
        background: rgba(255, 255, 255, 0.16);
      }

      .startup-skip:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 4px;
      }

      main {
        width: min(90vw, 700px);
      }

      .launcher {
        position: fixed;
        top: 50%;
        left: 50%;
        display: grid;
        width: 3.5rem;
        aspect-ratio: 1;
        place-items: center;
        transform: translate(-50%, -50%);
        border: 0;
        border-radius: 50%;
        background: #000;
        color: #fff;
        font: inherit;
        font-size: 1.75rem;
        line-height: 1;
        cursor: pointer;
        transition: background-color 200ms ease, color 200ms ease, transform 200ms ease;
      }

      body.is-dark .launcher {
        background: #fff;
        color: #000;
      }

      .launcher:hover {
        transform: translate(-50%, -50%) scale(1.08);
      }

      .launcher:focus-visible,
      .close-button:focus-visible,
      .background-toggle:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 4px;
      }

      .save-button:focus-visible,
      #shared-text:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }

      .content-panel {
        position: fixed;
        inset: 0;
        width: min(90vw, 700px);
        max-width: none;
        max-height: min(85vh, 700px);
        margin: auto;
        padding: 3rem 2.5rem;
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        background: #fff;
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08);
      }

      .content-panel[open] {
        animation: expand-in 220ms ease-out both;
      }

      .content-panel[open].is-closing {
        animation: collapse-out 180ms ease-in both;
      }

      .content-panel::backdrop {
        background: rgba(15, 23, 42, 0.12);
      }

      .close-button {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        display: grid;
        width: 2.5rem;
        aspect-ratio: 1;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 1.5rem;
        cursor: pointer;
      }

      .close-button:hover {
        background: var(--accent-soft);
        color: var(--text);
      }

      .background-toggle {
        margin-top: 1.5rem;
        padding: 0.65rem 0.9rem;
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      .shared-text-form {
        display: grid;
        gap: 0.65rem;
        margin-top: 1.5rem;
      }

      .shared-text-form label {
        color: var(--text);
        font-weight: 700;
      }

      #shared-text {
        width: 100%;
        min-height: 8rem;
        padding: 0.75rem;
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        color: var(--text);
        font: inherit;
        resize: vertical;
      }

      .save-button {
        justify-self: start;
        padding: 0.65rem 0.9rem;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }

      .save-button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #save-status {
        min-height: 1.5em;
        font-size: 0.95rem;
      }

      .saved-text {
        min-height: 1.8em;
        margin-top: 0.75rem;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      @keyframes expand-in {
        from {
          opacity: 0;
          transform: scale(0.15);
        }

        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes collapse-out {
        from {
          opacity: 1;
          transform: scale(1);
        }

        to {
          opacity: 0;
          transform: scale(0.15);
        }
      }

      @keyframes logo-arrive {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.88);
        }

        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes logo-float {
        from {
          transform: translateY(0) scale(1);
        }

        to {
          transform: translateY(-9px) scale(1.015);
        }
      }

      @keyframes logo-stripe-appear {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      @keyframes logo-complete {
        to {
          opacity: 1;
        }
      }

      @keyframes skip-arrive {
        from {
          opacity: 0;
          transform: translateY(5px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2.5rem, 6vw, 4rem);
        line-height: 1.1;
        letter-spacing: -0.04em;
        color: var(--accent);
      }

      p {
        margin: 0;
        font-size: 1.1rem;
        line-height: 1.8;
        color: var(--muted);
        max-width: 38rem;
      }
    </style>
  </head>
  <body>
    <div class="startup-screen" id="startup-screen">
      <div class="startup-logo-motion">
        <div class="startup-logo-art">
          <img class="startup-logo startup-logo-upper" src="/arvid-logo.png" alt="Arvid logo" width="500" height="500">
          <img class="startup-logo startup-logo-stripe startup-logo-stripe-1" src="/arvid-logo.png" alt="" aria-hidden="true">
          <img class="startup-logo startup-logo-stripe startup-logo-stripe-2" src="/arvid-logo.png" alt="" aria-hidden="true">
          <img class="startup-logo startup-logo-stripe startup-logo-stripe-3" src="/arvid-logo.png" alt="" aria-hidden="true">
          <img class="startup-logo startup-logo-stripe startup-logo-stripe-4" src="/arvid-logo.png" alt="" aria-hidden="true">
          <img class="startup-logo startup-logo-stripe startup-logo-stripe-5" src="/arvid-logo.png" alt="" aria-hidden="true">
          <img class="startup-logo startup-logo-stripe startup-logo-stripe-6" src="/arvid-logo.png" alt="" aria-hidden="true">
          <img class="startup-logo startup-logo-complete" src="/arvid-logo.png" alt="" aria-hidden="true">
        </div>
      </div>
      <button class="startup-skip" id="startup-skip" type="button">Skip intro</button>
    </div>
    <main>
      <button class="launcher" id="launcher" type="button" aria-label="Open shared text panel" aria-controls="content-panel" aria-expanded="false">
        +
      </button>
      <dialog class="content-panel" id="content-panel" aria-labelledby="panel-title">
        <button class="close-button" type="button" aria-label="Close panel">&times;</button>
        <h1 id="panel-title">Shared text</h1>
        <p>Everyone can see and edit this text. Changes are shared with all visitors.</p>
        <p class="saved-text" id="saved-text" aria-live="polite">Loading shared text...</p>
        <form class="shared-text-form" id="shared-text-form">
          <label for="shared-text">Edit the shared text</label>
          <textarea id="shared-text" name="text" maxlength="1000" aria-describedby="save-status"></textarea>
          <button class="save-button" id="save-button" type="submit">Save text</button>
          <p id="save-status" role="status"></p>
        </form>
        <button class="background-toggle" type="button" aria-pressed="false">Use dark background</button>
      </dialog>
    </main>
    <script>
      const startupScreen = document.querySelector("#startup-screen");
      const startupSkip = document.querySelector("#startup-skip");
      const launcher = document.querySelector("#launcher");
      const panel = document.querySelector("#content-panel");
      const closeButton = document.querySelector(".close-button");
      const backgroundToggle = document.querySelector(".background-toggle");
      const sharedTextForm = document.querySelector("#shared-text-form");
      const sharedTextInput = document.querySelector("#shared-text");
      const savedText = document.querySelector("#saved-text");
      const saveButton = document.querySelector("#save-button");
      const saveStatus = document.querySelector("#save-status");

      const loadSharedText = async () => {
        try {
          const response = await fetch("/api/shared-text", { cache: "no-store" });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Could not load shared text.");
          sharedTextInput.value = result.text;
          savedText.textContent = result.text || "(The shared text is empty.)";
        } catch (error) {
          savedText.textContent = "Shared text could not be loaded.";
          saveStatus.textContent = error.message;
        }
      };

      sharedTextForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        saveButton.disabled = true;
        saveStatus.textContent = "Saving...";
        try {
          const response = await fetch("/api/shared-text", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: sharedTextInput.value }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Could not save shared text.");
          sharedTextInput.value = result.text;
          savedText.textContent = result.text || "(The shared text is empty.)";
          saveStatus.textContent = "Saved for everyone.";
        } catch (error) {
          saveStatus.textContent = error.message;
        } finally {
          saveButton.disabled = false;
        }
      });

      loadSharedText();

      if (document.documentElement.classList.contains("show-startup")) {
        const page = document.querySelector("main");
        page.inert = true;

        const finishStartup = () => {
          if (startupScreen.classList.contains("is-leaving")) return;
          const restoreFocus = startupSkip.matches(":focus");
          startupScreen.classList.add("is-leaving");
          window.setTimeout(() => {
            startupScreen.remove();
            page.inert = false;
            if (restoreFocus) launcher.focus();
          }, 600);
        };

        startupSkip.addEventListener("click", finishStartup);
        window.setTimeout(finishStartup, 2500);
      }

      launcher.addEventListener("click", () => {
        panel.showModal();
        launcher.setAttribute("aria-expanded", "true");
      });
      const closePanel = () => {
        if (panel.classList.contains("is-closing")) return;
        panel.classList.add("is-closing");
        closeButton.disabled = true;
      };

      closeButton.addEventListener("click", closePanel);
      panel.addEventListener("cancel", (event) => {
        event.preventDefault();
        closePanel();
      });
      panel.addEventListener("animationend", (event) => {
        if (event.animationName === "collapse-out") panel.close();
      });
      panel.addEventListener("close", () => {
        panel.classList.remove("is-closing");
        closeButton.disabled = false;
        launcher.setAttribute("aria-expanded", "false");
        launcher.focus();
      });

      backgroundToggle.addEventListener("click", () => {
        const isDark = document.body.classList.toggle("is-dark");
        backgroundToggle.setAttribute("aria-pressed", String(isDark));
        backgroundToggle.textContent = isDark ? "Use light background" : "Use dark background";
      });
    </script>
  </body>
</html>
