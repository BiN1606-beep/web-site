worker_processes 1;
pid /tmp/web-site-nginx.pid;
error_log stderr notice;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    server {
        listen 8080;
        server_name localhost;

        root html;
        index index.html;

        location = /health {
            default_type application/json;
            content_by_lua_block {
                ngx.say('{"status":"ok"}')
            }
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}