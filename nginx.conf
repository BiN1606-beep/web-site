worker_processes 1;
pid /tmp/web-site-nginx.pid;
error_log stderr notice;

env PGHOST;
env PGPORT;
env PGDATABASE;
env PGUSER;
env PGPASSWORD;

env GOOGLE_CLIENT_ID;
env GOOGLE_CLIENT_SECRET;
env GOOGLE_REDIRECT_URI;

env GROQ_API_KEY;
env GROQ_FREE_QUOTA_CONFIRMED;
env GROQ_FREE_DAILY_REQUEST_LIMIT;

events {
    worker_connections 1024;
}

http {
    access_log /opt/mysite/access.log;
    resolver 127.0.0.53 valid=30s;
    lua_package_path "/opt/mysite/lua/?.lua;;";
    map "$request_method:$uri" $auth_rate_limit_key {
        default $binary_remote_addr;
        "GET:/api/auth/me" "";
        "GET:/api/auth/profile" "";
    }

    limit_req_zone $auth_rate_limit_key zone=auth_requests_v2:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=profile_requests:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=groq_chat:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=progress_tree:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=community_requests:10m rate=30r/m;

    server {
        listen 443 ssl;
        server_name osiris-ai.se;

        ssl_certificate /etc/letsencrypt/live/osiris-ai.se/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/osiris-ai.se/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            default_type text/plain;
            try_files $uri =404;
        }

        root /opt/mysite/public;
        index index.html;

        location = /login {
            try_files /login.html =404;
            add_header Cache-Control "no-store" always;
        }

        location = /api/auth/profile {
            client_body_buffer_size 256k;
            client_max_body_size 200k;
            limit_req zone=profile_requests burst=10 nodelay;
            limit_req_status 429;

            content_by_lua_block {
                require("auth").handle_request()
            }
        }

        location = /api/auth/profile/skip {
            limit_req zone=profile_requests burst=10 nodelay;
            limit_req_status 429;

            content_by_lua_block {
                require("auth").handle_request()
            }
        }

        location = /api/progress-tree {
            client_body_buffer_size 16k;
            client_max_body_size 16k;
            limit_req zone=progress_tree burst=5 nodelay;
            limit_req_status 429;

            content_by_lua_block {
                require("auth").handle_request()
            }
        }

        location = /api/community {
            client_body_buffer_size 16k;
            client_max_body_size 16k;
            limit_req zone=community_requests burst=15 nodelay;
            limit_req_status 429;

            content_by_lua_block {
                require("auth").handle_request()
            }
        }

        location ^~ /api/auth/ {
            client_body_buffer_size 256k;
            client_max_body_size 200k;
            limit_req zone=auth_requests_v2 burst=5 nodelay;
            limit_req_status 429;
            error_page 429 = @auth_rate_limited;

            content_by_lua_block {
                require("auth").handle_request()
            }
        }

        location @auth_rate_limited {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 429 '{"error":"Too many authentication requests. Please try again shortly."}';
        }

        location = /_internal/google-token {
            internal;
            proxy_pass_request_headers off;
            proxy_http_version 1.1;
            proxy_set_header Host oauth2.googleapis.com;
            proxy_set_header Content-Type application/x-www-form-urlencoded;
            proxy_set_header Content-Length $content_length;
            proxy_ssl_server_name on;
            proxy_ssl_name oauth2.googleapis.com;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 5;
            proxy_connect_timeout 10s;
            proxy_read_timeout 15s;
            proxy_pass https://oauth2.googleapis.com/token;
        }

        location = /_internal/google-userinfo {
            internal;
            proxy_pass_request_headers off;
            proxy_http_version 1.1;
            proxy_set_header Host openidconnect.googleapis.com;
            proxy_set_header Authorization $http_authorization;
            proxy_ssl_server_name on;
            proxy_ssl_name openidconnect.googleapis.com;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 5;
            proxy_connect_timeout 10s;
            proxy_read_timeout 15s;
            proxy_pass https://openidconnect.googleapis.com/v1/userinfo;
        }

        location = /api/groq-chat {
            client_body_buffer_size 24k;
            client_max_body_size 24k;
            limit_req zone=groq_chat burst=3 nodelay;
            limit_req_status 429;

            access_by_lua_block {
                if not require("auth").require_api_session() then
                    return
                end
            }

            # access_by_lua is skipped for subrequests; content_by_lua handles both.
            content_by_lua_block {
                return require("groq").handle_request()
            }
        }

        location = /_internal/groq-proxy {
            internal;
            proxy_pass_request_headers off;
            proxy_http_version 1.1;
            proxy_set_header Host api.groq.com;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type application/json;
            proxy_set_header Content-Length $content_length;
            proxy_set_header Connection "";
            proxy_ssl_server_name on;
            proxy_ssl_name api.groq.com;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 5;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_pass https://api.groq.com/openai/v1/chat/completions;
        }

        location = /api/shared-text {
            client_body_buffer_size 8k;
            client_max_body_size 8k;

            access_by_lua_block {
                if not require("auth").require_api_session() then
                    return
                end
            }

            content_by_lua_block {
                local cjson = require "cjson.safe"
                local method = ngx.req.get_method()

                local function respond(status, body)
                    ngx.status = status
                    ngx.header.content_type = "application/json; charset=utf-8"
                    ngx.header["Cache-Control"] = "no-store"
                    ngx.say(cjson.encode(body))
                end

                local text
                if method == "POST" then
                    ngx.req.read_body()
                    local raw_body = ngx.req.get_body_data()
                    if not raw_body then
                        respond(400, { error = "Request body is missing or too large." })
                        return
                    end

                    local body = cjson.decode(raw_body)
                    if type(body) ~= "table" or type(body.text) ~= "string" then
                        respond(400, { error = "Request must contain a text string." })
                        return
                    end
                    text = body.text
                    if #text > 4000 then
                        respond(400, { error = "Text must be 4000 bytes or fewer." })
                        return
                    end
                elseif method ~= "GET" then
                    ngx.header.allow = "GET, POST"
                    respond(405, { error = "Only GET and POST are supported." })
                    return
                end

                local host = os.getenv("PGHOST")
                local database = os.getenv("PGDATABASE")
                local user = os.getenv("PGUSER")
                local password = os.getenv("PGPASSWORD")
                local port = os.getenv("PGPORT") or "5432"
                if not host or not database or not user or not password then
                    ngx.log(ngx.ERR, "PostgreSQL connection environment is incomplete")
                    respond(500, { error = "Database connection is not configured." })
                    return
                end

                local pgmoon = require "pgmoon"
                local pg = pgmoon.new({
                    host = host,
                    port = port,
                    database = database,
                    user = user,
                    password = password,
                })

                local connect_call_ok, connected, connect_err = pcall(function()
                    return pg:connect()
                end)
                if not connect_call_ok then
                    ngx.log(ngx.ERR, "PostgreSQL connection raised an error: ", connected)
                    respond(502, { error = "Database connection failed; check the OpenResty error log." })
                    return
                end
                if not connected then
                    ngx.log(ngx.ERR, "PostgreSQL connection failed: ", connect_err or "unknown error")
                    respond(502, { error = "Could not connect to the database." })
                    return
                end

                local result, query_err
                if method == "GET" then
                    result, query_err = pg:query(
                        "SELECT value FROM public.shared_text WHERE id = 1"
                    )
                else
                    result, query_err = pg:query(
                        "UPDATE public.shared_text SET value = $1, updated_at = now() WHERE id = 1 RETURNING value",
                        text
                    )
                end
                pg:disconnect()

                if not result then
                    ngx.log(ngx.ERR, "PostgreSQL query failed: ", query_err or "unknown error")
                    respond(502, { error = "Could not read or save shared text." })
                    return
                end
                if not result[1] then
                    respond(500, { error = "Shared-text table is not initialized." })
                    return
                end

                respond(200, { text = result[1].value })
            }
        }

        location / {
            access_by_lua_block {
                if not require("auth").require_page_session() then
                    return
                end
            }

            try_files $uri $uri/ =404;
        }
    }



    server {
        listen 80;
        server_name osiris-ai.se;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

}