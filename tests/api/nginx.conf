# A cut-down copy of ../../nginx.conf for the API tests: no TLS, no rate
# limits, plain HTTP on port 8080. tests/run_all.sh starts it in Docker.
# Keep the locations in step with the real nginx.conf.
worker_processes 1;
error_log stderr warn;
env PGHOST; env PGPORT; env PGDATABASE; env PGUSER; env PGPASSWORD;
events { worker_connections 64; }
http {
    access_log off;
    types {
        text/html html; text/css css; application/javascript js; application/json json;
        application/manifest+json webmanifest; image/png png; image/jpeg jpg jpeg; image/gif gif;
        image/svg+xml svg; font/ttf ttf; text/plain txt;
    }
    default_type text/plain;
    resolver 127.0.0.11 ipv6=off;
    lua_package_path "/opt/mysite/lua/?.lua;/usr/local/openresty/site/lualib/?.lua;;";
    server_tokens off;
    lua_shared_dict login_failures 1m;
    # Reminders: the key is loaded like on the real site, but there is no
    # timer here; tests/reminders/reminder_test.py runs the sender through
    # /_test/send-reminders so each run is exactly when the test wants it.
    init_by_lua_block { require("osiris.push_sender").load_key() }
    server {
        listen 8080;
        header_filter_by_lua_block { require("osiris.security").add_headers() }
        location = /_test/send-reminders {
            content_by_lua_block {
                local sender = require("osiris.push_sender")
                -- The fake push service in the test, over plain http.
                sender.test_endpoint_prefix = ngx.unescape_uri(ngx.var.arg_allow or "")
                local counts, err = sender.run_once()
                ngx.say(require("cjson").encode(counts or { error = err }))
            }
        }
        root /opt/mysite/public;
        index index.html;
        location = /login { try_files /login.html =404; }
        location = /welcome { try_files /welcome.html =404; }
        location = /sw.js { try_files /sw.js =404; }
        location = /manifest.webmanifest { default_type application/manifest+json; try_files /manifest.webmanifest =404; }
        location ^~ /icons/ { try_files $uri =404; }
        location ~ ^/(js|css)/[a-z0-9-]+\.(js|css)$ { add_header Cache-Control "no-cache" always; try_files $uri =404; }
        location = /api/progress-tree { content_by_lua_block { require("auth").handle_request() } }
        location = /api/network-style { content_by_lua_block { require("auth").handle_request() } }
        location = /api/appearance { content_by_lua_block { require("auth").handle_request() } }
        location = /api/community { content_by_lua_block { require("auth").handle_request() } }
        location ^~ /api/auth/ { content_by_lua_block { require("auth").handle_request() } }
        location / {
            access_by_lua_block { if not require("auth").require_page_session() then return end }
            try_files $uri $uri/ =404;
        }
    }
}
